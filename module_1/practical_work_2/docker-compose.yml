version: "3.9"

services:
  ui:
    image: provectuslabs/kafka-ui:v0.7.0
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092,kafka-2:9092
      - KAFKA_CLUSTERS_0_NAME=kraft
    networks:
      - kafka-network
    
  kafka-0:
    image: bitnamilegacy/kafka:3.4
    container_name: kafka-0
    ports:
      - "9094:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes   ###включаем режим Kraft (без использования внешних сервисов)
      - ALLOW_PLAINTEXT_LISTENER=yes ##разрешение незашифрованного соединения
      - KAFKA_CFG_NODE_ID=0 ###ID узла (инстанса) Kafka
      - KAFKA_CFG_PROCESS_ROLES=broker,controller ###узел выполняет две роли: контроллера и брокера
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER ###логическое имя контроллера из конфигурации, через которое контроллер взаимодействует с остальными узлами kafka
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093 ###Перечисляем контроллеры по каждому узлу kafka
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv ###ID кластера kafka
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094  ###адреса и порты, на которых Kafka принимает соединения (внутренние и внешние).Здесь мы говорим Kafka, где искать входящие запросы.Первые два предназначены для внутренних коммуникаций внутри Docker, а последний ― для внешних соединений с хост-машиной.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092,EXTERNAL://127.0.0.1:9094  ###адреса и порты, которые Kafka «рекламирует» для подключения клиентов. Первый слушатель обслуживает внутренние коммуникации в Docker, второй ― внешние коммуникации с хост-машиной.
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT  ###определяет, какой протокол безопасности используется для каждого типа соединений.
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT ###параметр, который указывает, какой именно listener (сетевой интерфейс) брокеры должны использовать для связи друг с другом.
    volumes:
      - kafka_0_data:/bitnami/kafka
    networks:
      - kafka-network

  kafka-1:
    image: bitnamilegacy/kafka:3.4
    container_name: kafka-1
    ports:
      - "9095:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092,EXTERNAL://127.0.0.1:9095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_1_data:/bitnami/kafka
    networks:
      - kafka-network

  kafka-2:
    image: bitnamilegacy/kafka:3.4
    container_name: kafka-2
    ports:
      - "9096:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes   
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092,EXTERNAL://127.0.0.1:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_2_data:/bitnami/kafka
    networks:
      - kafka-network

  schema-registry:
   image: confluentinc/cp-schema-registry:7.7.13
   depends_on:
     - kafka-0
     - kafka-1
     - kafka-2
   ports:
     - "8081:8081"
   environment:
     SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-0:9092,PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092
     SCHEMA_REGISTRY_HOST_NAME: schema-registry
     SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
   healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
   networks:
      - kafka-network


  python-scripts:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./src:/apps/scripts
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    command: tail -f /dev/null ###чтобы работал вечно  
    networks:
      - kafka-network
    deploy:
      replicas: 2


networks:
  kafka-network:
    driver: bridge

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data: